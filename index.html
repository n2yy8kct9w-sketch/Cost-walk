<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cost Walk Studio</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cost Walk">
<meta name="theme-color" content="#2B3A42">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --ink:#17211F; --paper:#EDEFF2; --panel:#FFF; --mile:#2B3A42; --leg:#7A4FA3; --tgt:#1F5FBF;
  --esc:#B3402A; --red:#2F7D4E; --mut:#5A6670; --line:#E1E4E8; --bord:#C4CAD1; --unx:#8A939B; --cust:#C2417A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; padding:env(safe-area-inset-top) env(safe-area-inset-right) 48px env(safe-area-inset-left);
}
.wrap{max-width:1080px;margin:0 auto;padding:14px 12px}
h1{font-size:24px;font-weight:800;letter-spacing:.2px;margin:0 6px 0 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.spacer{margin-right:auto}
input,select{
  font:inherit;font-size:15px;padding:8px 9px;border:1.5px solid var(--bord);
  border-radius:5px;background:#FFF;color:var(--ink);min-width:0;-webkit-appearance:none;appearance:none;
}
input::placeholder{color:#9AA3AB;font-style:italic}
input:focus,select:focus{outline:2px solid var(--mile);outline-offset:1px}
button{
  font:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:5px;
  border:1.5px solid var(--ink);background:#FFF;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;
}
button.danger{border-color:var(--esc);color:var(--esc)}
button.on{border-color:var(--ink);background:var(--ink);color:#FFF}
button.off{border-color:#8A939B;color:#8A939B}
button:active{transform:translateY(1px)}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:7px;padding:13px;margin-bottom:12px}
.panel.legacy{border-color:var(--leg)}
.panel.newm{border-color:var(--mile);border-width:2.5px}
.grid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:11.5px;color:var(--mut)}
.grow{flex:1 1 200px}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.ptitle{font-size:13px;font-weight:700;margin:0 0 9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.ptitle.leg{color:var(--leg)} .ptitle.tgt{color:var(--tgt)} .ptitle.nm{color:var(--mile)}
.stage{display:flex;align-items:center;gap:6px}
.stage input{width:138px}
.stage .arrow{color:var(--mut);font-size:15px}
details.setup summary{font-weight:700;cursor:pointer;font-size:14.5px;list-style:none}
details.setup summary::-webkit-details-marker{display:none}
details.setup summary::before{content:"\25B8  ";color:var(--mut)}
details.setup[open] summary::before{content:"\25BE  "}
.catrow{display:inline-flex;align-items:center;gap:6px;margin:0 10px 8px 0}
.catrow input{width:150px}
.tgtbox{border:1.5px dashed var(--tgt);border-radius:6px;padding:10px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--ink);border-radius:5px;padding:8px 12px;background:var(--panel);min-width:112px}
.chip .l{font-size:11.5px;color:var(--mut);margin-bottom:2px}
.chip .v{font-size:18px;font-weight:800}
.chip.warn{border-color:var(--esc);background:#FBF1EE}
.chartbox{background:var(--panel);border:2px solid var(--ink);border-radius:7px;padding:12px 6px 2px;margin-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;margin-bottom:14px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.dash{width:18px;border-top:2.5px dashed var(--leg);display:inline-block}
.dash.t{border-top-color:var(--tgt);border-top-style:dotted;border-top-width:3px}
.hatch{background:repeating-linear-gradient(45deg,#B8BFC6 0 3px,#FFF 3px 6px);border:1px solid var(--unx)}
.tblbox{background:var(--panel);border:2px solid var(--ink);border-radius:7px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13.5px}
th{padding:9px 12px;text-align:left;font-size:14px;background:#F5F6F8;border-bottom:2px solid var(--ink)}
th.r,td.r{text-align:right}
td{padding:8px 12px;border-bottom:1px solid var(--line)}
tr.sep td{border-top:2px solid var(--line)}
tr.netrow td{background:#FBF7FA}
table tr > :first-child{position:sticky;left:0;z-index:1;background:#FFF;min-width:130px;max-width:170px;box-shadow:2px 0 0 var(--line)}
table tr > th:first-child{background:#F5F6F8}
tr.netrow > td:first-child{background:#FBF7FA}
tr:last-child td{border-bottom:none}
.auto{font-style:italic;color:var(--mut);font-size:11px;font-weight:400}
.phase{background:var(--panel);border:2px solid var(--ink);border-radius:7px;margin-bottom:12px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--ink);background:#F5F6F8;flex-wrap:wrap}
.phead b{font-size:16.5px}
.pnet{font-size:13px;font-weight:600}
.recon{padding:8px 12px;font-size:12.5px;background:#FAFBFC;border-bottom:1px solid var(--line)}
.recon.bad{background:#FBF1EE;color:#8C2F1E}
.recon.good{color:#2F7D4E}
.item{display:flex;flex-wrap:wrap;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:none}
.item input.lbl{flex:1 1 160px}
.item select{width:158px}
.item input.amt{width:92px;text-align:right;font-weight:600}
.custblock{padding:10px 12px;border-bottom:1px solid var(--line);background:#FDF6F9;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--cust)}
.cbrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cblump{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.cbdef{display:flex;flex-wrap:wrap;gap:8px}
.cbdef > div{flex:1 1 150px;background:#FFF;border:1.5px solid #E7A9C3;border-radius:6px;padding:7px 10px;display:flex;flex-direction:column}
.cbdef span{font-size:11.5px;color:var(--mut)}
.cbdef b{font-size:17px}
.cbdef em{font-size:11px;color:var(--mut)}
.pricegrid{display:flex;flex-wrap:wrap;gap:8px}
.pricecard{flex:1 1 150px;border:1.5px solid #E7A9C3;border-radius:6px;padding:8px;background:#FDF6F9;display:flex;flex-direction:column;gap:6px}
.custin.wide{width:100%}
.pnote{font-size:13px;padding:6px 8px;width:100%}
.custwrap{display:flex;align-items:center;gap:7px;flex:1 1 100%;padding:4px 0 0 21px}
.custlbl{font-size:12px;color:var(--cust);font-weight:600}
.custin{width:92px;text-align:right;font-weight:600;color:var(--cust);border-color:#E7A9C3}
.signbadge{font-weight:800;font-size:16px;width:14px;text-align:center}
.empty{padding:12px;font-size:13.5px;color:var(--mut)}
.pos{color:var(--esc)} .neg{color:var(--red)} .legc{color:var(--leg)} .tgtc{color:var(--tgt)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.saved{font-size:12.5px;color:#2F7D4E;font-weight:600}
#fileImp{display:none}
@media (max-width:520px){ h1{font-size:21px} .chip .v{font-size:16.5px} }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<input type="file" id="fileImp" accept="application/json">
<script>
"use strict";
/* ============ Cost Walk Studio — offline PWA (v4) ============
   New model cost is entered at every stage (blank = derived from walk items).
   Business-case target is set in absolute terms or relative to legacy.
   Walk items explain stage-to-stage movement; any balance shows as "Unexplained". */
const KEY = "costwalk-studio-v1";
const DEF_MIL = ["Business case", "Gen 1", "Gen 2", "SOP"];
const CAT_COLORS = { escalation:"#B3402A", content:"#B07A1E", reduction:"#2F7D4E", recovery:"#20647E", other:"#5A6670" };
const DEF_CATS = { escalation:"Escalation", content:"Value add / content", reduction:"Reduction (VAVE)", recovery:"Cost recovery", other:"Other" };
const MILE = "#2B3A42", MILE_AUTO = "#7F8F98", LEG = "#7A4FA3", TGT = "#1F5FBF", INK = "#17211F", UNX = "#8A939B", CUST = "#C2417A";

let idc = 0;
const uid = () => "i" + Date.now().toString(36) + (idc++).toString(36);
const fmt = n => new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 }).format(Math.round(n));
const fmtD = n => (n >= 0 ? "+" : "\u2212") + fmt(Math.abs(n));
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const isSet = v => v !== null && v !== undefined && v !== "" && isFinite(Number(v));
const catLabel = (w,k) => (w.cats && w.cats[k]) || DEF_CATS[k] || k;
const catColor = k => CAT_COLORS[k] || CAT_COLORS.other;
const pct = (d,b)=> b ? `${d>=0?"+":"\u2212"}${Math.abs(d/b*100).toFixed(1)}%` : "\u2014";
function signFor(cat, v){
  v = num(v);
  if (cat === "reduction" || cat === "recovery") return -Math.abs(v);
  if (cat === "escalation" || cat === "content") return Math.abs(v);
  return v;
}

/* Items whose cost can be passed on to customers through price */
const passable = i => num(i.amount) > 0 && i.category !== "reduction" && i.category !== "recovery";

function seedWalk(){
  const it = (phase,label,category,amount)=>({id:uid(),phase,label,category,amount});
  return {
    id: uid(),
    name: "50 HP Platform \u2014 Cost Walk",
    unit: "\u20B9 / tractor",
    milestones: DEF_MIL.slice(),
    cats: Object.assign({}, DEF_CATS),
    newCosts: [585000, 602300, 604000, null],   /* null = derive from walk */
    showTarget: true,
    /* Customer pass-on: standalone figure at each stage (NOT cumulative) */
    price: [2500, 11500, 15500, 14000],
    priceNote: ["Emission content premium in BC", "TREM V price increase agreed", "Hydraulics feature priced in", "Dealer support trims pass-on"],
    legacy: { name: "Legacy: current 47 HP model", show: true, costs: [596000, 601500, 604800, 607200] },
    items: [
      it(0,"Steel & pig iron escalation","escalation",9500),
      it(0,"TREM Stage V content","content",14200),
      it(0,"Tyre price negotiation","reduction",-3800),
      it(0,"Commodity recovery from suppliers","recovery",-2600),
      it(1,"Copper & aluminium escalation","escalation",2900),
      it(1,"Hydraulics spec upgrade","content",5600),
      it(1,"HVAC condenser resourcing","reduction",-4200),
      it(1,"Sheet-metal gauge VAVE","reduction",-3100),
      it(1,"Inbound freight recovery","recovery",-1200),
      it(2,"Final commodity escalation","escalation",2100),
      it(2,"Fastener consolidation","reduction",-900),
      it(2,"Paint process optimisation","reduction",-1400),
      it(2,"Tooling amortisation recovery","recovery",-1800)
    ]
  };
}
function migrate(w){
  if (!w.legacy || !Array.isArray(w.legacy.costs)){
    const c = num(w.refCost);
    w.legacy = { name: w.refName || "Legacy model", show: w.showRef !== false, costs: [c,c,c,c] };
  }
  if (!Array.isArray(w.milestones) || w.milestones.length < 2) w.milestones = DEF_MIL.slice();
  if (!w.cats) w.cats = Object.assign({}, DEF_CATS);
  const n = w.milestones.length;
  while (w.legacy.costs.length < n) w.legacy.costs.push(w.legacy.costs[w.legacy.costs.length-1] || 0);
  w.legacy.costs.length = n;
  if (!Array.isArray(w.newCosts)){
    w.newCosts = [num(w.bcCost)];            /* older walks: target only, rest derived */
    delete w.bcCost;
  }
  while (w.newCosts.length < n) w.newCosts.push(null);
  w.newCosts.length = n;
  if (!isSet(w.newCosts[0])) w.newCosts[0] = 0;
  if (w.showTarget === undefined) w.showTarget = true;
  if (!Array.isArray(w.price)){
    /* earlier versions accumulated item pass-on + lump sums + BC premium;
       convert that to the equivalent standalone figure at each stage so nothing changes on screen */
    const prem = Math.abs(num(w.bcPremium)), pc = w.phaseCust || [];
    let run = prem; w.price = [prem];
    for (let p = 0; p < n-1; p++){
      const it = (w.items||[]).filter(i => num(i.phase)===p && num(i.amount)>0 && i.category!=="reduction" && i.category!=="recovery");
      run += it.reduce((s,i)=>s+Math.abs(num(i.custRec)),0) + Math.abs(num(pc[p]));
      w.price.push(run);
    }
  }
  delete w.bcPremium; delete w.phaseCust;
  while (w.price.length < n) w.price.push(w.price[w.price.length-1] || 0);
  w.price.length = n;
  if (!Array.isArray(w.priceNote)) w.priceNote = [];
  while (w.priceNote.length < n) w.priceNote.push("");
  w.priceNote.length = n;
  if (w.cats.content === "Content / spec") w.cats.content = DEF_CATS.content;
  const maxP = n - 2;
  w.items.forEach(i => {
    i.phase = Math.min(Math.max(num(i.phase),0), maxP);
    i.amount = signFor(i.category, i.amount);
    delete i.custRec;
  });
  return w;
}

/* ---------- state & persistence ---------- */
let state = load();
let saveMsg = "";
let setupOpen = false;
function load(){
  try {
    const r = localStorage.getItem(KEY);
    if (r) {
      const s = JSON.parse(r);
      if (s.walks && Object.keys(s.walks).length) {
        Object.values(s.walks).forEach(migrate);
        if (!s.walks[s.activeId]) s.activeId = Object.keys(s.walks)[0];
        return s;
      }
    }
  } catch(e){}
  const w = seedWalk();
  return { walks: { [w.id]: w }, activeId: w.id };
}
function persist(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    saveMsg = "Saved \u2713 " + new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  } catch(e) { saveMsg = "Save failed \u2014 storage unavailable"; }
}
function mutate(fn){ fn(); persist(); render(); }
const walk = () => state.walks[state.activeId];

/* ---------- stage add / delete ---------- */
function addStage(w){
  const n = w.milestones.length;
  w.milestones.splice(n-1, 0, "New stage");
  w.legacy.costs.splice(n-1, 0, w.legacy.costs[n-2] || 0);
  w.newCosts.splice(n-1, 0, null);
  w.price.splice(n-1, 0, w.price[n-2] || 0);   /* start from previous stage's figure */
  w.priceNote.splice(n-1, 0, "");
}
function delStage(w, i){
  const n = w.milestones.length;
  if (n <= 2) return;
  w.milestones.splice(i,1);
  w.legacy.costs.splice(i,1);
  w.newCosts.splice(i,1);
  if (!isSet(w.newCosts[0])) w.newCosts[0] = 0;
  w.price.splice(i,1);               /* standalone per stage: removing a stage removes its figure */
  w.priceNote.splice(i,1);
  w.items.forEach(it => {
    let p = it.phase;
    if (i === 0)        p = Math.max(p-1, 0);
    else if (i === n-1) p = Math.min(p, n-3);
    else                p = (p < i) ? p : p-1;
    it.phase = p;
  });
}

/* ---------- core calculation ---------- */
function compute(w){
  const n = w.milestones.length;
  const mil = [num(w.newCosts[0])];
  const entered = [true];
  const phases = [];
  for (let p = 0; p < n-1; p++){
    const items = w.items.filter(i=>i.phase===p);
    const itemSum = items.reduce((s,i)=>s+num(i.amount),0);
    const expected = mil[p] + itemSum;
    let actual, unexplained = 0, ent = isSet(w.newCosts[p+1]);
    if (ent){ actual = num(w.newCosts[p+1]); unexplained = actual - expected; }
    else actual = expected;
    const valueAdd = items.filter(i=>i.category==="content").reduce((s,i)=>s+num(i.amount),0);
    const increases = items.filter(passable).reduce((s,i)=>s+num(i.amount),0);
    mil.push(actual); entered.push(ent);
    phases.push({ items, itemSum, change: actual - mil[p], unexplained, valueAdd, increases });
  }
  /* Customer pass-on (price recovery vs legacy) is a STANDALONE figure entered at each stage.
     price[i]      = total pass-on applicable at stage i (not added up across stages)
     net vs legacy = new - legacy - price[i]
     net vs target = new - target - (price[i] - price[0])   (target already reflects the BC pass-on) */
  const legC = w.legacy.costs.map(num);
  const target = mil[0];
  const price = mil.map((_,i)=> Math.abs(num((w.price||[])[i])));
  const priceLeg = price;
  const custCum = price.map(v => Math.max(v - price[0], 0));   /* beyond-BC portion (chart band) */
  const defLeg = mil.map((v,i)=> v - legC[i] - price[i]);
  const defTgt = mil.map((v,i)=> v - target - (price[i] - price[0]));
  const valueAddTot = phases.reduce((s,p)=>s+p.valueAdd,0);
  const increaseTot = phases.reduce((s,p)=>s+p.increases,0);
  return { mil, entered, phases, price, custCum, priceLeg, defLeg, defTgt, valueAddTot, increaseTot };
}

/* ------------------------- chart ------------------------- */
function buildBars(w, C){
  const bars = [{ t:"m", label: w.milestones[0], value: C.mil[0], mi:0, ent:true }];
  let run = C.mil[0];
  C.phases.forEach((ph,p)=>{
    ph.items.forEach(i=>{
      const start = run; run += num(i.amount);
      bars.push({ t:"d", label:i.label, amount:num(i.amount), start, end:run, cat:i.category });
    });
    if (Math.abs(ph.unexplained) >= 0.5){
      const start = run; run += ph.unexplained;
      bars.push({ t:"u", label:"Unexplained", amount:ph.unexplained, start, end:run });
    }
    bars.push({ t:"m", label: w.milestones[p+1], value: C.mil[p+1], mi:p+1, ent:C.entered[p+1] });
  });
  return bars;
}
function chartSVG(w, C){
  const bars = buildBars(w, C);
  const showLeg = w.legacy.show, showT = w.showTarget;
  const legC = w.legacy.costs.map(num);
  const target = C.mil[0];
  const BW=44, GAP=14, PADL=66, PADR=86, PADT=46, PADB=100, H=410;
  const W = PADL + bars.length*(BW+GAP) + PADR;
  const vals = bars.flatMap(b => b.t==="m" ? [b.value] : [b.start,b.end]);
  if (showLeg) vals.push(...legC);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = Math.max(hi-lo,1); lo -= span*0.30; hi += span*0.12;
  const y = v => PADT + ((hi-v)/(hi-lo))*(H-PADT-PADB);
  let s = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FFF"/><rect width="3" height="6" fill="#B8BFC6"/></pattern>
      <pattern id="custhatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="5" height="5" fill="#E7A9C3"/><rect width="2.5" height="5" fill="${CUST}"/></pattern></defs>`;
  const raw = (hi-lo)/4, mag = Math.pow(10, Math.floor(Math.log10(raw))), nr = raw/mag;
  const step = (nr<=1?1:nr<=2?2:nr<=2.5?2.5:nr<=5?5:10)*mag;
  const ticks = []; for (let t = Math.ceil(lo/step)*step; t <= hi; t += step) ticks.push(t);
  for (const t of ticks){
    s += `<line x1="${PADL}" x2="${W-PADR}" y1="${y(t)}" y2="${y(t)}" stroke="#D7DBE0"/>`;
    s += `<text x="${PADL-8}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="#5A6670">${fmt(t)}</text>`;
  }
  if (showT){
    s += `<line x1="${PADL}" x2="${W-PADR}" y1="${y(target)}" y2="${y(target)}" stroke="${TGT}" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>`;
    s += `<text x="${W-PADR+6}" y="${y(target)-3}" font-size="10.5" font-weight="700" fill="${TGT}">BC target</text>`;
    s += `<text x="${W-PADR+6}" y="${y(target)+10}" font-size="10.5" font-weight="600" fill="${TGT}">${fmt(target)}</text>`;
  }
  const milX = [];
  bars.forEach((b,i)=>{
    const x = PADL + i*(BW+GAP);
    if (b.t==="m"){
      milX[b.mi] = x + BW/2;
      const top = y(b.value);
      const lb = b.label.length>22 ? b.label.slice(0,21)+"\u2026" : b.label;
      const fill = b.ent ? MILE : MILE_AUTO;
      s += `<rect x="${x}" y="${top}" width="${BW}" height="${Math.max(H-PADB-top,2)}" fill="${fill}" rx="2"/>`;
      s += `<text x="${x+BW/2}" y="${top-7}" text-anchor="middle" font-size="11" font-weight="700" fill="${INK}">${fmt(b.value)}</text>`;
      /* top: post-BC customer recovery (striped) -> bottom = effective cost vs target
         below: BC price premium (light)            -> bottom = effective cost vs legacy */
      const cc = C.custCum[b.mi], prem = C.priceLeg[b.mi] - cc;
      let bandBot = top;
      if (cc >= 0.5){
        const yb = Math.min(y(b.value - cc), H-PADB), bh = Math.max(yb - top, 2);
        s += `<rect x="${x}" y="${top}" width="${BW}" height="${bh}" fill="url(#custhatch)" stroke="${CUST}" stroke-width="1.5"/>`;
        if (bh >= 15) s += `<text x="${x+BW/2}" y="${top+bh/2+4}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#FFF" stroke="${CUST}" stroke-width="2.5" paint-order="stroke">\u2212${fmt(cc)}</text>`;
        bandBot = yb;
      }
      if (prem >= 0.5){
        const yb = Math.min(y(b.value - cc - prem), H-PADB), bh = Math.max(yb - bandBot, 2);
        s += `<rect x="${x}" y="${bandBot}" width="${BW}" height="${bh}" fill="#F3D3E1" stroke="${CUST}" stroke-width="1" stroke-dasharray="2 2"/>`;
        if (bh >= 13) s += `<text x="${x+BW/2}" y="${bandBot+bh/2+3.5}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${CUST}">\u2212${fmt(prem)}</text>`;
        bandBot = yb;
      }
      if (bandBot > top) s += `<line x1="${x-3}" x2="${x+BW+3}" y1="${bandBot}" y2="${bandBot}" stroke="${CUST}" stroke-width="2"/>`;
      const inner = [];
      if (showT && b.mi>0) inner.push(["net vs tgt", C.defTgt[b.mi]]);
      if (showLeg) inner.push(["net vs leg", C.defLeg[b.mi]]);
      const barH = H-PADB-bandBot;
      if (barH >= inner.length*25 + 4){
        inner.forEach((it,k)=>{
          const base = H-PADB-6 - k*25;
          s += `<text x="${x+BW/2}" y="${base}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${it[1]>0?"#FFB4A6":"#A8E6BD"}">${fmtD(it[1])}</text>`;
          s += `<text x="${x+BW/2}" y="${base-11}" text-anchor="middle" font-size="8.5" fill="#DDE3E8">${it[0]}</text>`;
        });
      }
      s += `<text transform="translate(${x+BW/2+4},${H-PADB+12}) rotate(-42)" text-anchor="end" font-size="11" font-weight="700" fill="${INK}">${esc(lb)}${b.ent?"":" (auto)"}</text>`;
      if (i < bars.length-1) s += `<line x1="${x+BW}" x2="${x+BW+GAP}" y1="${top}" y2="${top}" stroke="#8A939B" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    } else {
      const y1 = y(Math.max(b.start,b.end));
      const h = Math.max(Math.abs(y(b.start)-y(b.end)),2);
      const unx = b.t==="u";
      const c = unx ? "#5A6670" : catColor(b.cat);
      const lb = b.label.length>20 ? b.label.slice(0,19)+"\u2026" : b.label;
      s += unx
        ? `<rect x="${x}" y="${y1}" width="${BW}" height="${h}" fill="url(#hatch)" stroke="${UNX}" stroke-width="1.2" rx="2"/>`
        : `<rect x="${x}" y="${y1}" width="${BW}" height="${h}" fill="${c}" rx="2"/>`;
      s += `<text x="${x+BW/2}" y="${y1-6}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${c}">${fmtD(b.amount)}</text>`;
      s += `<text transform="translate(${x+BW/2+4},${H-PADB+12}) rotate(-42)" text-anchor="end" font-size="10" fill="${unx?"#5A6670":"#3D4A47"}" ${unx?'font-style="italic"':''}>${esc(lb)}</text>`;
      s += `<line x1="${x+BW}" x2="${x+BW+GAP}" y1="${y(b.end)}" y2="${y(b.end)}" stroke="#8A939B" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    }
  });
  if (showLeg){
    const pts = legC.map((c,i)=>({x:milX[i], y:y(c), v:c}));
    s += `<polyline points="${pts.map(p=>p.x+","+p.y).join(" ")}" fill="none" stroke="${LEG}" stroke-width="2.5" stroke-dasharray="8 5"/>`;
    pts.forEach((p,i)=>{
      s += `<rect x="${p.x-5}" y="${p.y-5}" width="10" height="10" fill="${LEG}" stroke="#FFF" stroke-width="1.5" transform="rotate(45 ${p.x} ${p.y})"/>`;
      s += `<text x="${p.x+10}" y="${p.y+14}" font-size="10.5" font-weight="700" fill="${LEG}" stroke="#FFF" stroke-width="3" paint-order="stroke">${fmt(p.v)}</text>`;
    });
  }
  s += `<line x1="${PADL}" x2="${W-PADR}" y1="${H-PADB}" y2="${H-PADB}" stroke="${INK}" stroke-width="1.5"/></svg>`;
  return s;
}

/* ------------------------- render ------------------------- */
function render(){
  const w = walk();
  const M = w.milestones;
  const C = compute(w);
  const last = M.length-1;
  const target = C.mil[0];
  const endCost = C.mil[last];
  const legC = w.legacy.costs.map(num);
  const tVsLeg = target - legC[0];
  const sum = f => w.items.filter(f).reduce((s,i)=>s+num(i.amount),0);
  const escT = sum(i=>i.category==="escalation"||i.category==="content");
  const redT = sum(i=>i.category==="reduction");
  const recT = sum(i=>i.category==="recovery");
  const unxT = C.phases.reduce((s,p)=>s+p.unexplained,0);
  const newMove = endCost - target;
  const legMove = legC[last]-legC[0];
  const cls = v => Math.abs(v)<0.5 ? "" : (v>0 ? "pos" : "neg");
  const canDel = M.length > 2;

  let h = `
  <div class="bar">
    <h1>Cost Walk Studio</h1><span class="spacer"></span>
    <select id="walkSel">${Object.values(state.walks).map(x=>`<option value="${x.id}"${x.id===state.activeId?" selected":""}>${esc(x.name)}</option>`).join("")}</select>
    <button data-act="new">New</button>
    <button data-act="dup">Duplicate</button>
    <button data-act="del" class="danger">Delete</button>
    <button data-act="export">Export</button>
    <button data-act="import">Import</button>
    <span class="saved">${esc(saveMsg || "Autosaves on device")}</span>
  </div>

  <div class="panel"><div class="grid">
    <label class="fld grow"><span>Walk name</span><input data-w="name" value="${esc(w.name)}"></label>
    <label class="fld"><span>Unit</span><input data-w="unit" style="width:120px" value="${esc(w.unit)}"></label>
  </div></div>

  <details class="panel setup"${setupOpen?" open":""}>
    <summary>Setup \u2014 stages &amp; category names <span class="auto">(${M.map(esc).join(" \u2192 ")})</span></summary>
    <div class="ptitle" style="margin-top:12px">Stages / milestones \u2014 rename, add or remove</div>
    <div class="grid">
      ${M.map((m,i)=>`
        <span class="stage">
          <input data-mil="${i}" value="${esc(m)}">
          ${canDel ? `<button data-act="delMil:${i}" class="danger" title="Remove stage">\u2715</button>` : ""}
          ${i<M.length-1 ? `<span class="arrow">\u2192</span>` : ""}
        </span>`).join("")}
      <button data-act="addMil">+ Add stage</button>
    </div>
    <div class="hint">Removing a stage merges its walk items into the adjacent phase. A new stage is inserted before the final one. Minimum two stages.</div>
    <div class="ptitle" style="margin-top:14px">Category names \u2014 editable</div>
    <div>${Object.keys(DEF_CATS).map(k=>`<span class="catrow"><span class="sw" style="background:${catColor(k)}"></span><input data-cat="${k}" value="${esc(catLabel(w,k))}"></span>`).join("")}</div>
  </details>

  <div class="panel legacy">
    <div class="ptitle leg">Legacy model \u2014 cost at each stage (same time period)</div>
    <div class="grid">
      <label class="fld grow"><span>Legacy model name</span><input data-leg="name" value="${esc(w.legacy.name)}"></label>
      ${M.map((m,i)=>`<label class="fld"><span>Legacy at ${esc(m)}</span><input data-legcost="${i}" type="number" inputmode="decimal" style="width:120px" value="${esc(w.legacy.costs[i])}"></label>`).join("")}
      <div class="fld"><span>Show on chart</span><button data-act="toggleLeg" class="${w.legacy.show?"on":"off"}">${w.legacy.show?"On":"Off"}</button></div>
    </div>
  </div>

  <div class="panel newm">
    <div class="ptitle tgt">${esc(M[0])} target for new model \u2014 w.r.t. legacy</div>
    <div class="tgtbox"><div class="grid">
      <label class="fld"><span>Target cost (absolute)</span><input data-newcost="0" type="number" inputmode="decimal" style="width:130px" value="${esc(target)}"></label>
      <label class="fld"><span>Target vs legacy (\u0394 ${esc(w.unit)})</span><input data-tgtd="1" type="number" inputmode="decimal" style="width:130px" value="${Math.round(tVsLeg)}"></label>
      <label class="fld"><span>Target vs legacy (%)</span><input data-tgtp="1" type="number" inputmode="decimal" step="0.1" style="width:100px" value="${legC[0] ? (tVsLeg/legC[0]*100).toFixed(1) : ""}"></label>
      <div class="fld"><span>Target line on chart</span><button data-act="toggleTgt" class="${w.showTarget?"on":"off"}">${w.showTarget?"On":"Off"}</button></div>
    </div>
    <div class="hint">Legacy at ${esc(M[0])}: <b>${fmt(legC[0])}</b>. Enter any one of the three \u2014 e.g. \u0394 \u221211000 or \u22121.8% sets the target that much below legacy.</div></div>

    <div class="ptitle nm">New model \u2014 cost at each stage</div>
    <div class="grid">
      ${M.slice(1).map((m,j)=>{ const i=j+1; return `<label class="fld"><span>New model at ${esc(m)}</span><input data-newcost="${i}" type="number" inputmode="decimal" style="width:130px" value="${isSet(w.newCosts[i])?esc(w.newCosts[i]):""}" placeholder="auto ${fmt(C.mil[i])}"></label>`; }).join("")}
    </div>
    <div class="hint">Enter the new model's estimated/actual cost at each stage. Leave blank to derive it from the walk items. Where entered, any difference the walk items don't explain shows as a grey hatched \u201cUnexplained\u201d bar.</div>

    <div class="ptitle" style="color:var(--cust);margin-top:14px">Cost passed on to customer \u2014 standalone figure at each stage</div>
    <div class="pricegrid">
      ${M.map((m,i)=>`<div class="pricecard">
        <label class="fld"><span>Pass-on at ${esc(m)}${i===0?" (in BC)":""}</span><input class="custin wide" data-price="${i}" type="number" inputmode="decimal" min="0" value="${esc(C.price[i])}"></label>
        <input class="pnote" data-pricenote="${i}" placeholder="basis / remarks" value="${esc(w.priceNote[i])}">
        ${i>0?`<span class="auto">${C.price[i]-C.price[i-1]===0?"same as":fmtD(C.price[i]-C.price[i-1])+" vs"} ${esc(M[i-1])}</span>`:""}
      </div>`).join("")}
    </div>
    <div class="hint">Total price recovery from customers vs legacy (value adds, commodity pass-through, etc.) as applicable <b>at that stage</b> \u2014 each figure stands alone and is not added up across stages, so it can rise or fall. The ${esc(M[0])} figure is what the business case already assumes: it offsets the gap vs legacy, while the target comparison uses only the change from it.</div>
  </div>

  <div class="chips">
    <div class="chip"><div class="l">${esc(M[0])} target</div><div class="v tgtc">${fmt(target)}</div></div>
    <div class="chip"><div class="l">Target vs legacy</div><div class="v ${cls(tVsLeg)}">${fmtD(tVsLeg)} (${pct(tVsLeg,legC[0])})</div></div>
    <div class="chip"><div class="l">New model at ${esc(M[last])}</div><div class="v">${fmt(endCost)}</div></div>
    <div class="chip"><div class="l">${esc(M[last])} vs target (gross)</div><div class="v ${cls(newMove)}">${fmtD(newMove)} (${pct(newMove,target)})</div></div>
    <div class="chip ${C.defTgt[last]>0.5?"warn":""}"><div class="l">Net deficit vs target at ${esc(M[last])}</div><div class="v ${cls(C.defTgt[last])}">${fmtD(C.defTgt[last])}</div></div>
    <div class="chip"><div class="l">${esc(M[last])} vs legacy (gross)</div><div class="v ${cls(endCost-legC[last])}">${fmtD(endCost-legC[last])} (${pct(endCost-legC[last],legC[last])})</div></div>
    <div class="chip ${C.defLeg[last]>0.5?"warn":""}"><div class="l">Net deficit vs legacy at ${esc(M[last])}</div><div class="v ${cls(C.defLeg[last])}">${fmtD(C.defLeg[last])}</div></div>
    <div class="chip"><div class="l">Legacy movement (same period)</div><div class="v legc">${fmtD(legMove)} (${pct(legMove,legC[0])})</div></div>
    <div class="chip"><div class="l">${esc(catLabel(w,"escalation"))} + ${esc(catLabel(w,"content"))}</div><div class="v pos">${fmtD(escT)}</div></div>
    <div class="chip"><div class="l">${esc(catLabel(w,"reduction"))}</div><div class="v neg">${fmtD(redT)}</div></div>
    <div class="chip"><div class="l">${esc(catLabel(w,"recovery"))}</div><div class="v" style="color:#20647E">${fmtD(recT)}</div></div>
    <div class="chip"><div class="l">Value adds vs legacy (walk)</div><div class="v" style="color:#B07A1E">${fmtD(C.valueAddTot)}</div></div>
    <div class="chip"><div class="l">Passed to customer at ${esc(M[last])}</div><div class="v" style="color:var(--cust)">${fmt(C.price[last])} <span style="font-size:13px">(${fmtD(C.price[last]-C.price[0])} vs ${esc(M[0])})</span></div></div>
    ${Math.abs(unxT)>=0.5 ? `<div class="chip warn"><div class="l">Unexplained (walk vs entered)</div><div class="v" style="color:#5A6670">${fmtD(unxT)}</div></div>` : ""}
  </div>

  <div class="chartbox">${chartSVG(w, C)}</div>
  <div class="legend">
    <span class="k"><span class="sw" style="background:${MILE}"></span>New model (entered)</span>
    <span class="k"><span class="sw" style="background:${MILE_AUTO}"></span>New model (auto from walk)</span>
    ${Object.keys(DEF_CATS).map(k=>`<span class="k"><span class="sw" style="background:${catColor(k)}"></span>${esc(catLabel(w,k))}</span>`).join("")}
    <span class="k"><span class="sw hatch"></span>Unexplained</span>
    <span class="k"><span class="dash"></span>Legacy trajectory</span>
    <span class="k"><span class="dash t"></span>BC target</span>
    <span class="k"><span class="sw" style="background:repeating-linear-gradient(-45deg,#C2417A 0 2px,#E7A9C3 2px 4px);border:1px solid #C2417A"></span>Pass-on beyond ${esc(M[0])} level</span>
    <span class="k"><span class="sw" style="background:#F3D3E1;border:1px dashed #C2417A"></span>Pass-on already in ${esc(M[0])}</span>
    <span class="k" style="color:var(--mut)">Inside bars: net gap after customer recovery (red = deficit, green = surplus)</span>
  </div>

  <div class="tblbox"><table>
    <tr><th>Stage comparison (${esc(w.unit)})</th>${M.map(m=>`<th class="r">${esc(m)}</th>`).join("")}<th class="r">Movement</th></tr>
    <tr><td><b>New model</b></td>${C.mil.map((v,i)=>`<td class="r"><b>${fmt(v)}</b>${C.entered[i]?"":`<br><span class="auto">auto</span>`}</td>`).join("")}<td class="r ${cls(newMove)}"><b>${fmtD(newMove)}</b></td></tr>
    <tr><td class="legc"><b>${esc(w.legacy.name)}</b></td>${legC.map(v=>`<td class="r legc">${fmt(v)}</td>`).join("")}<td class="r legc"><b>${fmtD(legMove)}</b></td></tr>
    <tr><td class="tgtc"><b>${esc(M[0])} target</b></td>${M.map(()=>`<td class="r tgtc">${fmt(target)}</td>`).join("")}<td class="r tgtc">\u2014</td></tr>
    <tr><td style="color:var(--cust)"><b>Passed to customer</b><br><span class="auto">standalone at each stage</span></td>${C.price.map((v,i)=>`<td class="r" style="color:var(--cust)">${v?"\u2212"+fmt(v):"\u2014"}${w.priceNote[i]?`<br><span class="auto">${esc(w.priceNote[i])}</span>`:""}</td>`).join("")}<td class="r" style="color:var(--cust)"><b>${fmtD(C.price[last]-C.price[0])}</b></td></tr>
    <tr class="sep"><td>New vs legacy <span class="auto">gross</span></td>${C.mil.map((v,i)=>`<td class="r ${cls(v-legC[i])}">${fmtD(v-legC[i])}<br><span class="auto">${pct(v-legC[i],legC[i])}</span></td>`).join("")}<td class="r">${fmtD(newMove-legMove)}</td></tr>
    <tr class="netrow"><td><b>Net deficit vs legacy</b><br><span class="auto">after customer recovery</span></td>${C.defLeg.map((v,i)=>`<td class="r ${cls(v)}"><b>${fmtD(v)}</b><br><span class="auto">${Math.abs(v)<0.5?"closed":v>0?"deficit":"surplus"}</span></td>`).join("")}<td class="r"><b>${fmtD(C.defLeg[last]-C.defLeg[0])}</b></td></tr>
    <tr class="sep"><td>New vs ${esc(M[0])} target <span class="auto">gross</span></td>${C.mil.map(v=>`<td class="r ${cls(v-target)}">${fmtD(v-target)}<br><span class="auto">${pct(v-target,target)}</span></td>`).join("")}<td class="r">\u2014</td></tr>
    <tr class="netrow"><td><b>Net deficit vs ${esc(M[0])} target</b><br><span class="auto">after customer recovery</span></td>${C.defTgt.map(v=>`<td class="r ${cls(v)}"><b>${fmtD(v)}</b><br><span class="auto">${Math.abs(v)<0.5?"on target":v>0?"deficit":"surplus"}</span></td>`).join("")}<td class="r">\u2014</td></tr>
  </table></div>`;

  C.phases.forEach((ph,p)=>{
    const ent = C.entered[p+1];
    const unx = ph.unexplained;
    let recon;
    if (!ent) recon = `<div class="recon">${esc(M[p+1])} cost not entered \u2014 derived from walk items (${fmtD(ph.itemSum)}).</div>`;
    else if (Math.abs(unx) < 0.5) recon = `<div class="recon good">\u2713 Walk items fully explain the change ${fmtD(ph.change)}.</div>`;
    else recon = `<div class="recon bad">Change ${esc(M[p])} \u2192 ${esc(M[p+1])}: <b>${fmtD(ph.change)}</b> \u00b7 walk items: <b>${fmtD(ph.itemSum)}</b> \u00b7 unexplained: <b>${fmtD(unx)}</b> \u2014 add items to close the gap.</div>`;
    const dl = C.defLeg[p+1], dt = C.defTgt[p+1];
    const pNow = C.price[p+1], pPrev = C.price[p];
    const tag = v => Math.abs(v)<0.5 ? "closed" : v>0 ? "deficit" : "surplus";
    recon += `<div class="custblock">
      <div class="cbrow"><label class="cblump">Passed to customer at ${esc(M[p+1])}
        <input class="custin" data-price="${p+1}" type="number" inputmode="decimal" min="0" value="${esc(pNow)}"></label>
        <input class="pnote" style="flex:1 1 160px;width:auto" data-pricenote="${p+1}" placeholder="basis / remarks" value="${esc(w.priceNote[p+1])}"></div>
      <div class="cbrow"><span class="auto">Standalone figure \u00b7 at ${esc(M[p])}: ${fmt(pPrev)} (${pNow===pPrev?"no change":fmtD(pNow-pPrev)}) \u00b7 cost increases in this phase: ${fmtD(ph.increases)}</span></div>
      <div class="cbdef">
        <div><span>Net vs legacy at ${esc(M[p+1])}</span><b class="${cls(dl)}">${fmtD(dl)}</b><em>${tag(dl)}</em></div>
        <div><span>Net vs ${esc(M[0])} target at ${esc(M[p+1])}</span><b class="${cls(dt)}">${fmtD(dt)}</b><em>${tag(dt)}</em></div>
      </div>
    </div>`;
    h += `<div class="phase">
      <div class="phead"><b>${esc(M[p])} \u2192 ${esc(M[p+1])}</b><span class="pnet ${cls(ph.change)}">stage change ${fmtD(ph.change)}</span><span class="spacer"></span><button data-act="addItem:${p}">+ Add item</button></div>
      ${recon}`;
    if (!ph.items.length) h += `<div class="empty">No items yet \u2014 add escalations, reductions or recoveries for this phase.</div>`;
    ph.items.forEach(i=>{
      const c = catColor(i.category);
      h += `<div class="item">
        <input class="lbl" data-item="${i.id}" data-f="label" value="${esc(i.label)}">
        <select data-item="${i.id}" data-f="category" style="border-color:${c};border-width:2px">
          ${Object.keys(DEF_CATS).map(k=>`<option value="${k}"${k===i.category?" selected":""}>${esc(catLabel(w,k))}</option>`).join("")}
        </select>
        <span class="signbadge ${cls(num(i.amount))}">${num(i.amount)>0?"+":"\u2212"}</span><input class="amt ${cls(num(i.amount))}" data-item="${i.id}" data-f="amount" type="number" inputmode="decimal" min="0" value="${esc(Math.abs(num(i.amount)))}">
        <button data-act="delItem:${i.id}" class="danger">\u2715</button>
      </div>`;
    });
    h += `</div>`;
  });

  h += `<div class="note">Enter item amounts in ${esc(w.unit)} without a sign \u2014 ${esc(catLabel(w,"escalation"))} and ${esc(catLabel(w,"content"))} add, ${esc(catLabel(w,"reduction"))} and ${esc(catLabel(w,"recovery"))} subtract (\u201c${esc(catLabel(w,"other"))}\u201d keeps the sign you type). <b style="color:var(--cust)">Passed to customer</b> is entered as a standalone figure at each stage \u2014 it doesn't change cost, but offsets the deficit vs legacy and target. Everything autosaves; use Export for a JSON backup.</div>`;
  document.getElementById("app").innerHTML = h;
}

/* ------------------------- events ------------------------- */
document.addEventListener("toggle", e => {
  if (e.target.classList && e.target.classList.contains("setup")) setupOpen = e.target.open;
}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "walkSel") return mutate(()=>{ state.activeId = t.value; });
  if (t.id === "fileImp") return;
  const w = walk();
  const d = t.dataset;
  if (d.w !== undefined) return mutate(()=>{ w[d.w] = t.value; });
  if (d.mil !== undefined) return mutate(()=>{ w.milestones[+d.mil] = t.value || "Stage"; });
  if (d.cat !== undefined) return mutate(()=>{ w.cats[d.cat] = t.value || DEF_CATS[d.cat]; });
  if (d.leg !== undefined) return mutate(()=>{ w.legacy[d.leg] = t.value; });
  if (d.legcost !== undefined) return mutate(()=>{ w.legacy.costs[+d.legcost] = num(t.value); });
  if (d.newcost !== undefined) return mutate(()=>{
    const i = +d.newcost;
    w.newCosts[i] = (t.value === "" && i > 0) ? null : num(t.value);
  });
  if (d.price !== undefined) return mutate(()=>{ w.price[+d.price] = Math.abs(num(t.value)); });
  if (d.pricenote !== undefined) return mutate(()=>{ w.priceNote[+d.pricenote] = t.value; });
  if (d.tgtd !== undefined) return mutate(()=>{ w.newCosts[0] = num(w.legacy.costs[0]) + num(t.value); });
  if (d.tgtp !== undefined) return mutate(()=>{ w.newCosts[0] = Math.round(num(w.legacy.costs[0]) * (1 + num(t.value)/100)); });
  if (d.item){
    const it = w.items.find(i=>i.id===d.item);
    if (it) return mutate(()=>{
      if (d.f === "amount")        it.amount = signFor(it.category, t.value);
      else if (d.f === "category"){ it.category = t.value; it.amount = signFor(t.value, it.amount); }
      else                          it[d.f] = t.value;
    });
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const [act, arg] = b.dataset.act.split(":");
  const w = walk();
  if (act==="new") mutate(()=>{
    const nw = { id:uid(), name:"New cost walk", unit:w.unit, milestones: DEF_MIL.slice(), cats: Object.assign({}, DEF_CATS),
      newCosts:[0,null,null,null], showTarget:true, price:[0,0,0,0], priceNote:["","","",""],
      legacy:{name:"Legacy model", show:true, costs:[0,0,0,0]}, items:[] };
    state.walks[nw.id]=nw; state.activeId=nw.id;
  });
  else if (act==="dup") mutate(()=>{
    const c = JSON.parse(JSON.stringify(w)); c.id=uid(); c.name=w.name+" (copy)";
    c.items = c.items.map(i=>({...i,id:uid()}));
    state.walks[c.id]=c; state.activeId=c.id;
  });
  else if (act==="del"){
    if (!confirm(`Delete "${w.name}"? This cannot be undone.`)) return;
    mutate(()=>{
      delete state.walks[state.activeId];
      if (!Object.keys(state.walks).length){ const s=seedWalk(); state.walks[s.id]=s; }
      state.activeId = Object.keys(state.walks)[0];
    });
  }
  else if (act==="addMil") mutate(()=>{ addStage(w); });
  else if (act==="delMil"){
    const i = +arg;
    if (!confirm(`Remove stage "${w.milestones[i]}"? Its walk items merge into the adjacent phase.`)) return;
    mutate(()=>{ delStage(w, i); });
  }
  else if (act==="toggleLeg") mutate(()=>{ w.legacy.show = !w.legacy.show; });
  else if (act==="toggleTgt") mutate(()=>{ w.showTarget = !w.showTarget; });
  else if (act==="addItem") mutate(()=>{ w.items.push({id:uid(), phase:+arg, label:"New item", category:"reduction", amount:0}); });
  else if (act==="delItem") mutate(()=>{ w.items = w.items.filter(i=>i.id!==arg); });
  else if (act==="export"){
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "cost-walks-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  }
  else if (act==="import") document.getElementById("fileImp").click();
});
document.getElementById("fileImp").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.walks || !Object.keys(d.walks).length) throw new Error("no walks");
      Object.values(d.walks).forEach(migrate);
      mutate(()=>{
        Object.values(d.walks).forEach(x=>{ state.walks[x.id]=x; });
        state.activeId = d.activeId && state.walks[d.activeId] ? d.activeId : Object.keys(state.walks)[0];
      });
      alert("Imported " + Object.keys(d.walks).length + " walk(s). They've been added alongside your existing walks.");
    } catch(err){ alert("Import failed \u2014 that file isn't a Cost Walk Studio backup."); }
  };
  r.readAsText(f);
  e.target.value = "";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
render();
</script>
